
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEFOLT VISUAL</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  background: #090711;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}
header {
  padding: 22px;
  display: flex;
  justify-content: center;
  border-bottom: 1px solid #292039;
}
.logo {
  color: #b76aff;
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 2px;
  text-shadow: 0 0 18px #8c35ff;
}
main {
  min-height: 80vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 25px;
}
.icon {
  width: 110px;
  height: 110px;
  border: 2px solid #a34cff;
  border-radius: 25px;
  display: grid;
  place-items: center;
  font-size: 55px;
  color: #c28aff;
  background: #1b102d;
  box-shadow: 0 0 35px #7625bb66;
  margin-bottom: 30px;
}
h1 {
  font-size: clamp(34px, 8vw, 58px);
  color: #c18aff;
  text-shadow: 0 0 25px #8738ff;
}
.subtitle {
  color: #aaa0bd;
  margin-top: 15px;
  font-size: 17px;
}
.status {
  margin-top: 35px;
  padding: 15px 28px;
  border: 1px solid #9144d9;
  border-radius: 12px;
  background: #211331;
  color: #d5adff;
  font-weight: bold;
  box-shadow: 0 0 20px #8738ff33;
}
.info {
  margin-top: 25px;
  color: #81778f;
  font-size: 14px;
  line-height: 1.7;
}
footer {
  text-align: center;
  padding: 25px;
  color: #766b85;
  border-top: 1px solid #292039;
  font-size: 13px;
}
</style>
</head>
<body>

<header>
  <div class="logo">DEFOLT VISUAL</div>
</header>

<main>
  <div class="icon">DV</div>
  <h1>DEFOLT VISUAL</h1>
  <p class="subtitle">Minecraft PvP • Java Edition 1.21.11</p>

  <div class="status">
    ✦ ФУНКЦИИ СКОРО ✦
  </div>

  <p class="info">
    Новый визуальный проект для Minecraft.<br>
    Удобство, стиль и комфорт в PvP.<br>
    Следите за обновлениями!
  </p>
</main>

<footer>
  © 2026 DEFOLT VISUAL. All rights reserved.
</footer>

</body>
</html>
